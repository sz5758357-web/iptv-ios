<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src * data: blob:; media-src * blob:; connect-src *; worker-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPTV Player">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>IPTV Player</title>
<script>
/* Awaryjne ukrycie ekranu startowego: interfejs ma być widoczny nawet,
   jeśli skrypt odtwarzacza napotka błąd. */
window.setTimeout(function () {
  var splash = document.getElementById('splash');
  if (splash) {
    splash.classList.add('out');
    window.setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 700);
  }
}, 2200);
window.addEventListener('error', function (event) {
  var splash = document.getElementById('splash');
  if (splash) {
    splash.classList.add('out');
    window.setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 100);
  }
});
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash" id="splash"><div class="sig"><i></i><i></i><i></i><b></b></div><h1><span>I</span><span>P</span><span>T</span><span>V</span><span class="w">Player</span></h1><div class="pbar"><i></i></div></div>
<div class="app">
  <aside class="side">
    <div class="top">
      <div class="brand"><span class="dot"></span>IPTV Player</div>
      <div class="row">
        <input class="in" id="url" type="url" placeholder="Adres listy .m3u / .m3u8" aria-label="Adres listy">
        <button class="btn main" id="go">Wczytaj</button>
      </div>
      <div class="row">
        <button class="btn" id="pick">Plik z dysku</button>
        <button class="btn" id="chk" title="Sprawdź, które kanały działają">Sprawdź</button>
        <input class="in" id="q" type="search" placeholder="Szukaj kanału" aria-label="Szukaj kanału">
      </div>
      <div class="row"><input class="in" id="epg" type="url" placeholder="Adres EPG (XMLTV .xml / .xml.gz)" aria-label="Adres EPG"><button class="btn" id="epgb">EPG</button></div>
      <div class="msg" id="emsg"></div>
      <div class="msg" id="msg">Wczytaj listę kanałów, aby zacząć.</div>
      <input id="file" type="file" accept=".m3u,.m3u8,.txt,.xml,.gz" hidden>
    </div>
    <div class="chips" id="chips"></div>
    <ul id="ul"></ul>
  </aside>
  <main class="stage">
    <div class="screen">
      <video id="v" playsinline controls></video>
      <div class="ov" id="ov"><div class="card"><div class="sig"><i></i><i></i><i></i><b></b></div><div class="tn">Wybierz kanał z listy</div></div></div>
      <aside class="guide" id="guide"><div class="gh"><b id="gt">Program</b><button class="btn" id="gx" title="Zamknij (Esc)">✕</button></div><div class="gl" id="gl"></div></aside>
      <div class="osd" id="osd"><span class="n" id="on"></span><span class="m" id="oname"></span></div>
      <div class="buf" id="buf" hidden>Buforowanie…</div>
    </div>
    <div class="info">
      <span class="logo" id="il"></span>
      <div class="t"><b id="cn">—</b><small id="cg"></small><div class="epgl" id="epgl"></div></div>
      <button class="btn" id="gb" title="Program (G)">Program</button>
      <button class="btn" id="pv" title="Poprzedni kanał (↑)">▲</button>
      <button class="btn" id="nx" title="Następny kanał (↓)">▼</button>
      <button class="btn" id="fs" title="Pełny ekran (F)">Pełny ekran</button>
    </div>
  </main>
</div>
<script src="lib/hls.min.js"></script>
<script src="lib/mpegts.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
